name: Prepare and publish approved release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.0.1
        required: true
        type: string
      publish_confirmation:
        description: Type PUBLISH to authorize publishing this GitHub Release
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    name: Release build (${{ matrix.architecture }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project, build, and test dependencies
        run: python -m pip install -e '.[dev,build]'
      - name: Run regression suite
        run: python -m pytest -o addopts='' -q
      - name: Build, sign, notarize, and verify app/DMG
        env:
          NEXUS_RELEASE_REPOSITORY: ${{ github.repository }}
          NEXUS_MACOS_CERT_P12_BASE64: ${{ secrets.NEXUS_MACOS_CERT_P12_BASE64 }}
          NEXUS_MACOS_CERT_PASSWORD: ${{ secrets.NEXUS_MACOS_CERT_PASSWORD }}
          NEXUS_MACOS_SIGNING_IDENTITY: ${{ secrets.NEXUS_MACOS_SIGNING_IDENTITY }}
          NEXUS_APPLE_API_KEY_BASE64: ${{ secrets.NEXUS_APPLE_API_KEY_BASE64 }}
          NEXUS_APPLE_API_KEY_ID: ${{ secrets.NEXUS_APPLE_API_KEY_ID }}
          NEXUS_APPLE_API_ISSUER_ID: ${{ secrets.NEXUS_APPLE_API_ISSUER_ID }}
        run: bash scripts/release_macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NEXUS-macOS-release-${{ matrix.architecture }}
          path: |
            release/NEXUS-*-macos-${{ matrix.architecture }}.dmg
            release/SHA256SUMS-${{ matrix.architecture }}.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [macos]
    if: ${{ inputs.publish_confirmation == 'PUBLISH' }}
    runs-on: windows-latest
    environment: macos-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate tag matches centralized version
        shell: pwsh
        env:
          NEXUS_REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if ($env:NEXUS_REQUESTED_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix.' }
          $Version = python -c 'from nexus import __version__; print(__version__)'
          if ("v$Version" -ne $env:NEXUS_REQUESTED_TAG) { throw "Tag does not match package version $Version" }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build Windows release
        shell: pwsh
        run: ./scripts/build_release.ps1 -ReleaseRepository "${{ github.repository }}"
      - name: Download tested macOS release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: NEXUS-macOS-release-*
          path: release/macos
          merge-multiple: true
      - name: Assemble cross-platform SHA-256 manifest
        shell: pwsh
        run: |
          $Version = python -c 'from nexus import __version__; print(__version__)'
          $Files = @(
            (Join-Path $PWD "release/NEXUS-Setup-$Version-x64.exe"),
            (Join-Path $PWD "release/NEXUS-$Version-macos-arm64.dmg"),
            (Join-Path $PWD "release/NEXUS-$Version-macos-x64.dmg")
          )
          foreach ($File in $Files) {
            if (-not (Test-Path -LiteralPath $File -PathType Leaf)) { throw "Missing release artifact: $File" }
          }
          $Lines = foreach ($File in $Files) {
            $Hash = (Get-FileHash -LiteralPath $File -Algorithm SHA256).Hash.ToLowerInvariant()
            "$Hash  $(Split-Path -Leaf $File)"
          }
          $Lines | Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Encoding ascii
          Get-ChildItem 'release/macos' -Filter '*.dmg' | Move-Item -Destination 'release'
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Version = python -c 'from nexus import __version__; print(__version__)'
          gh release create "v$Version" `
            "release/NEXUS-Setup-$Version-x64.exe" `
            "release/NEXUS-$Version-macos-arm64.dmg" `
            "release/NEXUS-$Version-macos-x64.dmg" `
            release/SHA256SUMS.txt `
            --title "NEXUS $Version" `
            --notes-file release/RELEASE_NOTES.md
