name: macOS tests and native installers

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    name: macOS ${{ matrix.architecture }} tests and DMG
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project, build, and test dependencies
        run: python -m pip install -e '.[dev,build]'
      - name: Run regression suite
        run: python -m pytest -o addopts='' -q
      - name: Compile Python sources and check dependencies
        run: |
          python -m compileall -q nexus tests scripts
          python -m pip check
      - name: Build and smoke-test NEXUS.app
        run: bash scripts/build_macos.sh
      - name: Package architecture-specific DMG
        run: bash scripts/build_dmg.sh
      - name: Upload unsigned development artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NEXUS-macOS-${{ matrix.architecture }}
          path: |
            release/NEXUS-*-macos-${{ matrix.architecture }}.dmg
            release/SHA256SUMS-${{ matrix.architecture }}.txt
          if-no-files-found: error
          retention-days: 14
