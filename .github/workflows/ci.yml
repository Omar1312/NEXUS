name: NEXUS CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    name: Windows tests and package
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test and validate source
        run: |
          python -m pytest -o addopts='' -q
          python -m compileall -q nexus tests scripts
          python -m pip check
      - name: Build frozen Windows application
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SkipTests
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build_installer.ps1
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NEXUS-Windows-${{ github.sha }}
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    name: macOS ${{ matrix.architecture }} tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev,build]'
      - name: Test and validate source
        run: |
          python -m pytest -o addopts='' -q
          python -m compileall -q nexus tests scripts
          python -m pip check
      - name: Build native app and DMG
        run: |
          bash scripts/build_macos.sh
          bash scripts/build_dmg.sh
      - name: Upload unsigned macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NEXUS-macOS-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            release/NEXUS-*-macos-${{ matrix.architecture }}.dmg
            release/SHA256SUMS-${{ matrix.architecture }}.txt
          if-no-files-found: error
          retention-days: 14
